--[[
  天打邪 APL - 泰坦时光服优化版
  原作者：疯狂不龟路
  深度重构：念秋
  泰坦时光服适配：优化AOE阈值(2目标起传染)、降低泄能阈值(90RP)
  适用服务器：泰坦重铸「时光」服务器（基于WLK 80级框架）
  最新优化：
    1. 召唤天鬼后自动切换绿脸（天鬼吃实时急速增益）
    2. 爆发优化：移除开怪循环中的食尸鬼狂乱和活力分流，支持战斗前预铺30秒狂乱buff
    3. 狂乱补充：buff剩余≤5秒时自动补充（活力分流+食尸鬼狂乱），避免开怪时浪费分流
    4. 炸弹优化：爆发期（石像鬼后、大军前）使用手套+炸弹，让亡者大军享受15秒急速buff
]]

