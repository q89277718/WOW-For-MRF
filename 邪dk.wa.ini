local function IsCD(spellID)
    return (math.max(0, VF_getSpellCD(spellID)-VF_getSpellCD(61304)) >= 1)
end

local function GetRP()
    return UnitPower("player", 6) or 0
end

local function PestInfo()
    local count, seen = 0, {}
    for i = 1, 40 do
        local uid = "nameplate" .. i
        -- 添加保护，避免访问无效的单位
        local success, exists = pcall(UnitExists, uid)
        if not success or not exists then break end
        
        if UnitCanAttack("player", uid) and not UnitIsDead(uid) then
            if WeakAuras.CheckRange(uid, 8, "<=") then
                local guid = UnitGUID(uid)
                if guid and not seen[guid] then
                    seen[guid], count = true, count + 1
                end
            end
        end
    end
    return math.max(0, count - 1)
end

local function IsGlovesReady()
    return _isBoss 
        and WAParam.config.useGlovesAuto 
        and (VF_getItemCD(10) == 0) 
        and WeakAuras.CheckRange("target", 5, "<=")
end

